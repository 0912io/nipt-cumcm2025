# On pull_request and on push to main: Ubuntu 24.04, Python 3.9–3.12.
# Install requirements, byte-compile src, and run the synthetic tests in
# tests/. This workflow does not read the official workbook 附件.xlsx.

name: Compile and synthetic tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    name: Python ${{ matrix.python-version }}
    # ubuntu-latest is Ubuntu 26.04, and actions/setup-python has no
    # CPython 3.9 build for that image. 24.04 still provides 3.9–3.12.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Byte-compile sources
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m pytest -q tests
